apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: irso
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: default
  source:
    repoURL: https://github.com/metal3-io/ironic-standalone-operator.git
    targetRevision: v0.11.0
    path: config/default
  destination:
    server: https://kubernetes.default.svc
    namespace: ironic-standalone-operator-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
