apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../system
patches:
  - target:
      group: argoproj.io
      version: v1alpha1
      kind: Application
      name: ironic
    patch: |-
      - op: replace
        path: /spec/source/path
        value: infra/system/ironic/overlays/workload
