apiVersion: v1
kind: ConfigMap
metadata:
  name: hermes-config
data:
  config.yaml: |
    # Start as a responsive, local personal chat. The default platform bundle
    # exposes dozens of tool schemas and makes CPU prompt processing take
    # minutes. Enable individual toolsets later when they are needed.
    toolsets: []
    agent:
      # MoA uses cloud reference models. Keep this installation fully local.
      disabled_toolsets:
        - moa
      max_turns: 1
    model:
      provider: custom
      default: qwen2.5-7b-local
      base_url: http://llama-cpp.hermes.svc.cluster.local:8080/v1
      api_key: local
      # Hermes Agent requires this advertised 64k window. The CPU server uses
      # the model's native 32k window and truncates only older conversation
      # history beyond that limit.
      context_length: 65536
