apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
patches:
  - target:
      group: ironic.metal3.io
      version: v1alpha1
      kind: Ironic
      name: ironic
    patch: |-
      - op: replace
        path: /spec/networking/interface
        value: enx00e04c247a98
      - op: replace
        path: /spec/networking/ipAddress
        value: 172.16.0.10
      - op: replace
        path: /spec/networking/keepalived/enabled
        value: false
