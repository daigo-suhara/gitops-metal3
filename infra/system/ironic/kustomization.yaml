apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: metal3

resources:
  - https://github.com/metal3-io/baremetal-operator//config/default?ref=v0.13.0
  - https://github.com/metal3-io/baremetal-operator//ironic-deployment/default?ref=v0.13.0

components:
  - https://github.com/metal3-io/baremetal-operator//ironic-deployment/components/keepalived?ref=v0.13.0

images:
  - name: quay.io/metal3-io/ironic
    newTag: release-38.0

patches:
  - path: ironic-deployment-patch.yaml
    target:
      kind: Deployment
      name: baremetal-operator-ironic
  - path: ironic-configmap-patch.yaml
    target:
      kind: ConfigMap
      name: ironic
  - target:
      kind: ConfigMap
      name: ironic-bmo-configmap
    patch: |-
      - op: add
        path: /data/PROVISIONING_IP
        value: 172.16.0.10
      - op: add
        path: /data/PROVISIONING_INTERFACE
        value: enx00e04c247a98
      - op: add
        path: /data/DEPLOY_KERNEL_URL
        value: http://172.16.0.10:6180/images/ironic-python-agent.kernel
      - op: add
        path: /data/DEPLOY_RAMDISK_URL
        value: http://172.16.0.10:6180/images/ironic-python-agent.initramfs
      - op: add
        path: /data/IRONIC_ENDPOINT
        value: http://172.16.0.10:6385/v1/
  # JSON Patch cleanly replaces the base's emptyDir with the PVC. A
  # strategic merge patch would union the two volume-source fields and
  # trip "may not specify more than 1 volume type".
  - target:
      version: v1
      kind: Deployment
      name: baremetal-operator-ironic
    patch: |-
      - op: replace
        path: /spec/template/spec/volumes/0
        value:
          name: ironic-data-volume
          persistentVolumeClaim:
            claimName: ironic-data

patchesJson6902:
  - target:
      group: rbac.authorization.k8s.io
      version: v1
      kind: ClusterRole
      name: baremetal-operator-manager-role
    path: ironic-clusterrole-patch.yaml

replacements:
  - source:
      kind: Certificate
      group: cert-manager.io
      version: v1
      name: baremetal-operator-serving-cert
      fieldPath: .metadata.namespace
    targets:
      - select:
          kind: CustomResourceDefinition
        fieldPaths:
          - metadata.annotations.[cert-manager.io/inject-ca-from]
        options:
          delimiter: /
          index: 0
          create: true
      - select:
          kind: ValidatingWebhookConfiguration
        fieldPaths:
          - metadata.annotations.[cert-manager.io/inject-ca-from]
        options:
          delimiter: /
          index: 0
          create: true
  - source:
      kind: Certificate
      group: cert-manager.io
      version: v1
      name: baremetal-operator-serving-cert
      fieldPath: .metadata.name
    targets:
      - select:
          kind: CustomResourceDefinition
        fieldPaths:
          - metadata.annotations.[cert-manager.io/inject-ca-from]
        options:
          delimiter: /
          index: 1
          create: true
      - select:
          kind: ValidatingWebhookConfiguration
        fieldPaths:
          - metadata.annotations.[cert-manager.io/inject-ca-from]
        options:
          delimiter: /
          index: 1
          create: true
  - source:
      kind: Service
      version: v1
      name: baremetal-operator-webhook-service
      fieldPath: .metadata.name
    targets:
      - select:
          kind: Certificate
          group: cert-manager.io
          version: v1
          name: baremetal-operator-serving-cert
        fieldPaths:
          - spec.dnsNames.0
          - spec.dnsNames.1
        options:
          delimiter: .
          index: 0
          create: true
  - source:
      kind: Service
      version: v1
      name: baremetal-operator-webhook-service
      fieldPath: .metadata.namespace
    targets:
      - select:
          kind: Certificate
          group: cert-manager.io
          version: v1
          name: baremetal-operator-serving-cert
        fieldPaths:
          - spec.dnsNames.0
          - spec.dnsNames.1
        options:
          delimiter: .
          index: 1
          create: true
