# Grants the coder server SA (coder/coder) the permissions its
# Kubernetes workspace templates need to spin up per-user Pods, PVCs,
# and Services in the coder namespace.
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: coder-workspace
  namespace: coder
rules:
  - apiGroups: [""]
    resources: [pods, persistentvolumeclaims, services, secrets, configmaps, serviceaccounts]
    verbs: [get, list, watch, create, update, patch, delete, deletecollection]
  - apiGroups: [""]
    resources: [pods/log, pods/exec, pods/attach, pods/portforward]
    verbs: [get, list, create]
  - apiGroups: [""]
    resources: [events]
    verbs: [get, list, watch]
  - apiGroups: [apps]
    resources: [deployments, statefulsets, replicasets]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [networking.k8s.io]
    resources: [ingresses, networkpolicies]
    verbs: [get, list, watch, create, update, patch, delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: coder-workspace
  namespace: coder
subjects:
  - kind: ServiceAccount
    name: coder
    namespace: coder
roleRef:
  kind: Role
  name: coder-workspace
  apiGroup: rbac.authorization.k8s.io
