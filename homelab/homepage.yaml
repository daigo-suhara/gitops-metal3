# Homepage homelab dashboard. Exposed via Cilium L2 LoadBalancer on a fixed
# LAN IP so it can be bookmarked directly.
#
# The actual dashboard resources live in homelab/homepage/ and are synced by
# this Argo CD Application. Homepage itself reads YAML config files from
# /app/config.
#
# Cilium LB pool is 172.16.100.100-149 (see cluster/addons/cilium.yaml).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: homepage
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "30"
spec:
  project: default
  source:
    repoURL: https://github.com/daigo-suhara/gitops-metal3.git
    targetRevision: main
    path: homelab/homepage
  destination:
    server: https://kubernetes.default.svc
    namespace: homepage
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions: [CreateNamespace=true, ServerSideApply=true]
    retry:
      limit: 10
      backoff: { duration: 30s, factor: 2, maxDuration: 5m }
