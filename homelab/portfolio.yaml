# This Application deliberately keeps the previous `wordpress` identity.
# Updating an Application in place lets Argo CD prune the WordPress, MariaDB,
# and their Services during the same reconciliation; creating a second
# Application would leave the old release behind.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: wordpress
  namespace: argocd
  labels:
    app.kubernetes.io/name: portfolio
  annotations:
    argocd.argoproj.io/sync-wave: "30"
spec:
  project: default
  source:
    repoURL: https://github.com/daigo-suhara/gitops-metal3.git
    targetRevision: HEAD
    path: homelab/portfolio
  destination:
    server: https://kubernetes.default.svc
    # Retain the former namespace and Service name so the existing Cloudflare
    # Tunnel route (wordpress.wordpress.svc.cluster.local:80) keeps serving
    # daigo-suhara.com without a dashboard-side change.
    namespace: wordpress
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    retry:
      limit: 10
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 5m
