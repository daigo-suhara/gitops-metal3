apiVersion: apps/v1
kind: Deployment
metadata:
  name: mysite
  labels:
    app.kubernetes.io/name: mysite
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: mysite
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mysite
    spec:
      automountServiceAccountToken: false
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        # Built from https://github.com/daigo-suhara/mysite. GitHub Actions
        # publishes this exact source revision to GHCR on pushes to main.
        - name: mysite
          image: ghcr.io/daigo-suhara/mysite:sha-9027180
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          securityContext:
            runAsNonRoot: true
            runAsUser: 101
            runAsGroup: 101
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
            readOnlyRootFilesystem: true
          resources:
            requests: { cpu: 25m, memory: 64Mi }
            limits: { memory: 128Mi }
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 5
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 2
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
