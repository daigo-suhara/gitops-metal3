# Coder (coder.com) — LAN-only cloud dev environment.
# Two Applications: a Bitnami PostgreSQL HA cluster (backing DB) and the
# Coder server itself. Sync-wave orders PG before Coder so migrations
# don't race the DB.
#
# Access: http://172.16.100.103 (Cilium LB, pinned via io.cilium/lb-ipam-ips
# on coder.coder.svc). Update CODER_ACCESS_URL below if the IP changes.
#
# DB creds are inline (LAN-only, homelab pattern like wordpress.yaml).
# Rotate by editing the values below and letting ArgoCD reconcile.
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: coder-postgres
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: default
  source:
    repoURL: https://charts.bitnami.com/bitnami
    chart: postgresql
    targetRevision: 18.4.0
    helm:
      releaseName: coder
      valuesObject:
        # Bitnami public bitnami/postgresql tags were dropped in 2025;
        # use bitnamilegacy/* which still ships versioned tags.
        image:
          registry: docker.io
          repository: bitnamilegacy/postgresql
          tag: "17.6.0-debian-12-r4"
        auth:
          username: coder
          password: coder-pg-pass
          database: coder
          postgresPassword: coder-super-pass
        primary:
          persistence:
            enabled: true
            storageClass: general
            size: 8Gi
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits:   { memory: 1Gi }
  destination:
    server: https://kubernetes.default.svc
    namespace: coder
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions: [CreateNamespace=true, ServerSideApply=true]
    retry:
      limit: 10
      backoff: { duration: 30s, factor: 2, maxDuration: 5m }
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: coder
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "10"
spec:
  project: default
  source:
    repoURL: https://helm.coder.com/v2
    chart: coder
    targetRevision: 2.36.0
    helm:
      releaseName: coder
      valuesObject:
        coder:
          replicaCount: 1
          service:
            type: LoadBalancer
            enableNodePort: false
            annotations:
              io.cilium/lb-ipam-ips: "172.16.100.103"
          env:
            - name: CODER_PG_CONNECTION_URL
              value: "postgres://coder:coder-pg-pass@coder-postgresql.coder.svc.cluster.local:5432/coder?sslmode=disable"
            - name: CODER_ACCESS_URL
              value: "http://172.16.100.103"
            - name: CODER_WILDCARD_ACCESS_URL
              value: "*.172.16.100.103.sslip.io"
          resources:
            requests: { cpu: 250m, memory: 512Mi }
            limits:   { memory: 2Gi }
  destination:
    server: https://kubernetes.default.svc
    namespace: coder
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions: [CreateNamespace=true, ServerSideApply=true]
    retry:
      limit: 10
      backoff: { duration: 30s, factor: 2, maxDuration: 5m }
