apiVersion: apps/v1
kind: Deployment
metadata:
  name: hermes
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: hermes
  template:
    metadata:
      labels:
        app.kubernetes.io/name: hermes
    spec:
      automountServiceAccountToken: false
      # Avoid the hermes-dashboard Service injecting HERMES_DASHBOARD_PORT as
      # a tcp:// URL; Hermes expects that variable to be a numeric port.
      enableServiceLinks: false
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: seed-config
          image: busybox:1.36
          command: [sh, -ec, 'cp /config/config.yaml /data/config.yaml']
          volumeMounts:
            - name: data
              mountPath: /data
            - name: config
              mountPath: /config
              readOnly: true
      containers:
        - name: hermes
          image: nousresearch/hermes-agent:latest
          args: [gateway, run]
          ports:
            - name: gateway
              containerPort: 8642
            - name: dashboard
              containerPort: 9119
          env:
            # Roll the Pod when the ConfigMap seed changes, so it never keeps
            # an older copy in the writable data PVC.
            - name: HERMES_CONFIG_REVISION
              value: qwen3-local-v2
            - name: HERMES_DASHBOARD
              value: "1"
            - name: HERMES_DASHBOARD_BASIC_AUTH_USERNAME
              valueFrom:
                secretKeyRef:
                  name: hermes-dashboard-auth
                  key: username
            - name: HERMES_DASHBOARD_BASIC_AUTH_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: hermes-dashboard-auth
                  key: password
          resources:
            requests: { cpu: 250m, memory: 512Mi }
            limits: { cpu: "2", memory: 2Gi }
          livenessProbe:
            tcpSocket: { port: dashboard }
            initialDelaySeconds: 20
            periodSeconds: 30
          readinessProbe:
            tcpSocket: { port: dashboard }
            initialDelaySeconds: 10
            periodSeconds: 10
          volumeMounts:
            - name: data
              mountPath: /opt/data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: hermes-data
        - name: config
          configMap:
            name: hermes-config
