apiVersion: apps/v1
kind: Deployment
metadata:
  name: llama-cpp
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: llama-cpp
  template:
    metadata:
      labels:
        app.kubernetes.io/name: llama-cpp
    spec:
      automountServiceAccountToken: false
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: llama-cpp
          image: ghcr.io/ggml-org/llama.cpp:server
          args:
            - -hf
            - unsloth/gemma-4-E4B-it-GGUF:UD-Q4_K_XL
            - --alias
            - gemma-4-e4b-local
            - --ctx-size
            - "65536"
            - --jinja
            - --host
            - 0.0.0.0
            - --port
            - "8080"
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: XDG_CACHE_HOME
              value: /models/.cache
          resources:
            requests: { cpu: "4", memory: 12Gi }
            limits: { cpu: "16", memory: 24Gi }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
            readOnlyRootFilesystem: true
            runAsNonRoot: true
          startupProbe:
            httpGet: { path: /health, port: http }
            failureThreshold: 90
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 30
          readinessProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 10
          volumeMounts:
            - name: models
              mountPath: /models
      volumes:
        - name: models
          persistentVolumeClaim:
            claimName: llama-cpp-models
