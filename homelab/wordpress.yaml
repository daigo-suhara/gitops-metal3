apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: wordpress
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "30"
spec:
  project: default
  source:
    repoURL: https://charts.bitnami.com/bitnami
    chart: wordpress
    targetRevision: 27.1.5
    helm:
      releaseName: wordpress
      valuesObject:
        global:
          security:
            allowInsecureImages: true
        service:
          type: LoadBalancer
        persistence:
          size: 5Gi
        mariadb:
          enabled: true
          primary:
            persistence:
              size: 5Gi
  destination:
    server: https://kubernetes.default.svc
    namespace: wordpress
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
