apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: openstack
helmCharts:
  - name: skyline
    repo: https://tarballs.opendev.org/openstack/openstack-helm
    version: 2026.1.6+f1fa8faed
    releaseName: skyline
    namespace: openstack
    includeCRDs: true
    valuesInline:
      # Skyline UI is served over port 9999. The chart Service (skyline-api)
      # is ClusterIP-only; the LoadBalancer alias sits in
      # ../bootstrap/service-aliases.yaml (172.16.100.111).
      conf:
        skyline:
          # The login page's Domain dropdown reads from openstack.base_domains
          # (it does NOT fetch /v3/domains — that needs a token, and the login
          # form is anonymous). Without this the dropdown is empty and users
          # can't submit the form.
          openstack:
            base_domains:
              - default
      manifests:
        job_image_repo_sync: false
patches:
  # Strip helm.sh/hook so post-install Jobs become Sync-phase (else PostSync
  # deadlock — init container waits on Jobs that ArgoCD hasn't run yet).
  - target: {kind: Job, annotationSelector: helm.sh/hook}
    patch: |-
      - op: remove
        path: /metadata/annotations/helm.sh~1hook
  # Also strip orphaned helm.sh/hook-weight (ArgoCD treats it as a hook
  # indicator too, which would pull Jobs to sync-wave -5 and starve
  # ServiceAccounts).
  - target: {kind: Job, annotationSelector: helm.sh/hook-weight}
    patch: |-
      - op: remove
        path: /metadata/annotations/helm.sh~1hook-weight
  # Workaround for upstream Skyline bug where the login page's Domain
  # dropdown calls /api/openstack/skyline/api/v1/contrib/domains, which
  # requires auth and always 401s pre-login → dropdown stays empty
  # ("NoData"). See https://bugs.launchpad.net/skyline-apiserver/+bug/2156287
  # (regression from commit 8aca4f75).
  #
  # Insert an nginx `location =` block that intercepts that exact URL
  # BEFORE the /api/openstack/skyline/ proxy_pass and returns the domain
  # list statically. Done via sed on the generated nginx.conf right
  # before nginx starts (the chart cp's the file, sed modifies, nginx
  # starts).
  - target: {kind: Deployment, name: skyline}
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/command/2
        value: |
          cp /etc/nginx/.skyline/nginx.conf /etc/nginx/nginx.conf
          sed -i "s|location /api/openstack/skyline/ {|location = /api/openstack/skyline/api/v1/contrib/domains { default_type application/json; return 200 '[\"Default\"]'; }\n        location /api/openstack/skyline/ {|" /etc/nginx/nginx.conf
          exec nginx -g 'daemon off;'
