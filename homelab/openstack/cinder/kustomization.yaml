apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: openstack
resources:
  # PreSync Job that fetches client.cinder key from Rook and creates
  # cinder-volume-rbd-keyring Secret.
  - rook-keyring-setup.yaml
helmCharts:
  - name: cinder
    repo: https://tarballs.opendev.org/openstack/openstack-helm
    version: 2026.1.14+a659ab8a2
    releaseName: cinder
    namespace: openstack
    includeCRDs: true
    valuesInline:
      # Cinder CSI in magnum-created workload clusters reads the volumev3
      # public endpoint from keystone. Pin to the LAN-reachable LB IP.
      endpoints:
        volumev3:
          host_fqdn_override:
            public:
              host: 172.16.100.106
      manifests:
        job_image_repo_sync: false
        pod_rally_test: false
        deployment_backup: false
        job_storage_init: false
        job_backup_storage_init: false
      conf:
        cinder:
          DEFAULT:
            enabled_backends: rbd1
        backends:
          rbd1:
            rbd_pool: rbd
patches:
  # Strip helm.sh/hook so post-install Jobs become Sync-phase (else PostSync
  # deadlock — init container waits on Jobs that ArgoCD hasn't run yet).
  - target: {kind: Job, annotationSelector: helm.sh/hook}
    patch: |-
      - op: remove
        path: /metadata/annotations/helm.sh~1hook
  # cinder-clean is a pre-delete-only hook, not needed on install.
  - target: {kind: Job, name: cinder-clean}
    patch: |-
      $patch: delete
      apiVersion: batch/v1
      kind: Job
      metadata:
        name: cinder-clean
