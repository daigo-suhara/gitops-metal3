apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# One ArgoCD Application per OpenStack component. Filename prefix = sync-wave:
#   10-*  infra (mariadb, rabbitmq, memcached)
#   15-*  ceph-adapter-rook (writes ceph-etc / ceph client keys into openstack ns)
#   18-19 ovs + libvirt daemonsets (before neutron/nova depend on them)
#   20-*  keystone, neutron (identity + network core)
#   21-*  glance, placement (image + resource tracking)
#   22-*  cinder, nova (block + compute — need keystone/glance/placement)
#   23-*  horizon (dashboard)
#   24-*  magnum (container-infra — needs everything above)
#   25-*  bootstrap Jobs (LB Services, image uploads, external network, cluster template)
resources:
  - 10-mariadb.yaml
  - 10-memcached.yaml
  - 10-rabbitmq.yaml
  - 15-ceph-adapter-rook.yaml
  - 18-openvswitch.yaml
  - 19-libvirt.yaml
  - 20-keystone.yaml
  - 20-neutron.yaml
  - 21-glance.yaml
  - 21-placement.yaml
  - 22-cinder.yaml
  - 22-nova.yaml
  - 23-horizon.yaml
  - 24-magnum.yaml
  - 25-bootstrap.yaml
