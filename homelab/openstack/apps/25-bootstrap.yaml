apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: openstack-bootstrap
  namespace: argocd
  annotations:
    # After keystone (20) and glance (21). Applies post-install runtime state:
    # keystone LB Services, glance image uploads, magnum cluster template.
    argocd.argoproj.io/sync-wave: "25"
spec:
  project: default
  source:
    repoURL: https://github.com/daigo-suhara/gitops-metal3.git
    targetRevision: HEAD
    path: homelab/openstack/bootstrap
  destination:
    server: https://kubernetes.default.svc
    namespace: openstack
  syncPolicy:
    automated: {prune: true, selfHeal: true}
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
