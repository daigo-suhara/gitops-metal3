apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: rabbitmq
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "10"
spec:
  project: default
  source:
    repoURL: https://tarballs.opendev.org/openstack/openstack-helm-infra
    chart: rabbitmq
    targetRevision: 0.1.45
    helm:
      # valuesObject silently drops boolean false here (openstack-helm-infra
      # + argocd-repo-server quirk); use --set-style parameters instead.
      parameters:
        - name: manifests.ingress_management
          value: "false"
  destination:
    server: https://kubernetes.default.svc
    namespace: openstack
  syncPolicy:
    automated: {prune: true, selfHeal: true}
    syncOptions:
      - CreateNamespace=true
      - RespectIgnoreDifferences=true
