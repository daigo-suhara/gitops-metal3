apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: openstack
helmCharts:
  - name: neutron
    repo: https://tarballs.opendev.org/openstack/openstack-helm
    version: 2026.1.15+a659ab8a2
    releaseName: neutron
    namespace: openstack
    includeCRDs: true
    valuesInline:
      # openstack-cloud-controller-manager inside magnum-created workload
      # clusters resolves the neutron public endpoint from keystone's catalog.
      # Default puts svc.cluster.local there — unreachable from VMs. Pin the
      # public URL to the LAN-reachable LoadBalancer IP (see bootstrap/
      # service-aliases.yaml).
      endpoints:
        network:
          host_fqdn_override:
            public:
              host: 172.16.100.105
      manifests:
        daemonset_sriov_agent: false
        pod_rally_test: false
        job_image_repo_sync: false
      pod:
        # nodes have no FQDN in DNS; short hostname avoids empty host= config
        use_fqdn:
          neutron_agent: false
      conf:
        # Auto-create br-ex on each compute host (via the neutron-ovs-agent
        # init script) and bridge eno2 (the second, unused NIC) into it so
        # neutron floating IPs are reachable from the LAN via L2. eno1 stays
        # untouched (it's the k8s node IP / API endpoint). The init script
        # also runs `ip link set eno2 up`.
        #
        # Cilium's LB IPAM pool is scoped to 172.16.100.100-149 to avoid
        # ARP conflict with the neutron external-subnet 150-199.
        auto_bridge_add:
          br-ex: eno2
        plugins:
          openvswitch_agent:
            ovs:
              bridge_mappings: physnet1:br-ex
          ml2:
            ml2_type_flat:
              flat_networks: physnet1
patches:
  # Strip helm.sh/hook so post-install Jobs become Sync-phase (else PostSync
  # deadlock — init container waits on Jobs that ArgoCD hasn't run yet).
  - target: {kind: Job, annotationSelector: helm.sh/hook}
    patch: |-
      - op: remove
        path: /metadata/annotations/helm.sh~1hook
