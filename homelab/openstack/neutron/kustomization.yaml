apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: openstack
helmCharts:
  - name: neutron
    repo: https://tarballs.opendev.org/openstack/openstack-helm
    version: 2026.1.15+a659ab8a2
    releaseName: neutron
    namespace: openstack
    includeCRDs: true
    valuesInline:
      manifests:
        daemonset_sriov_agent: false
        pod_rally_test: false
        job_image_repo_sync: false
      pod:
        # nodes have no FQDN in DNS; short hostname avoids empty host= config
        use_fqdn:
          neutron_agent: false
      conf:
        # Auto-create br-ex on each compute host (via the neutron-ovs-agent
        # init script). Empty value = bridge only, no physical port — VMs
        # communicate on tenant Geneve networks; the external network's
        # floating IPs live on this bridge but are not L2-bridged to LAN.
        # (Uncomment `br-ex: eno1` to bridge the host NIC, but that moves
        # eno1's IP into OVS and can break k8s node connectivity.)
        auto_bridge_add:
          br-ex: ""
        plugins:
          openvswitch_agent:
            ovs:
              bridge_mappings: physnet1:br-ex
          ml2:
            ml2_type_flat:
              flat_networks: physnet1
patches:
  # Strip helm.sh/hook so post-install Jobs become Sync-phase (else PostSync
  # deadlock — init container waits on Jobs that ArgoCD hasn't run yet).
  - target: {kind: Job, annotationSelector: helm.sh/hook}
    patch: |-
      - op: remove
        path: /metadata/annotations/helm.sh~1hook
