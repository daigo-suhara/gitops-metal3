apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ceph-adapter-rook
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "15"
spec:
  project: default
  source:
    repoURL: https://github.com/daigo-suhara/gitops-metal3.git
    targetRevision: HEAD
    path: homelab/openstack/ceph-adapter-rook
  destination:
    server: https://kubernetes.default.svc
    namespace: openstack
  syncPolicy:
    automated: {prune: true, selfHeal: true}
    syncOptions:
      - CreateNamespace=true
      - RespectIgnoreDifferences=true
  # ceph-etc ConfigMap's /data is patched at runtime by the
  # namespace-client-ceph-config Job (mon_host discovery). The chart template
  # has `mon_host = will be discovered`, so selfHeal would revert the Job's
  # patch on every reconcile.
  ignoreDifferences:
    - group: ""
      kind: ConfigMap
      name: ceph-etc
      jsonPointers:
        - /data
