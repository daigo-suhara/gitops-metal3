apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: openstack
helmCharts:
  - name: nova
    repo: https://tarballs.opendev.org/openstack/openstack-helm
    version: 2026.1.13+a659ab8a2
    releaseName: nova
    namespace: openstack
    includeCRDs: true
    valuesInline:
      # OCCM in magnum-created workload clusters uses the compute public
      # endpoint from keystone's catalog. Pin to the LAN-reachable LB IP.
      endpoints:
        compute:
          host_fqdn_override:
            public:
              host: 172.16.100.104
      manifests:
        deployment_serialproxy: false
        deployment_spiceproxy: false
        pod_rally_test: false
        job_image_repo_sync: false
      pod:
        use_fqdn:
          compute: false
      conf:
        nova:
          vnc:
            # LB IP for browser VNC console (svc.cluster.local not resolvable from browser).
            # Pinned to nova-novncproxy-lb Service in ../bootstrap/service-aliases.yaml.
            novncproxy_base_url: http://172.16.100.108:6080/vnc_lite.html
patches:
  # Strip helm.sh/hook so post-install Jobs become Sync-phase (else PostSync
  # deadlock — init container waits on Jobs that ArgoCD hasn't run yet).
  - target: {kind: Job, annotationSelector: helm.sh/hook}
    patch: |-
      - op: remove
        path: /metadata/annotations/helm.sh~1hook
