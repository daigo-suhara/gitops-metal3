apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# App-of-apps entry: one Application per service, each in its own dir.
# Order below = sync-wave order (also set in each application.yaml).
resources:
  - mariadb/application.yaml
  - memcached/application.yaml
  - rabbitmq/application.yaml
  - ceph-adapter-rook/application.yaml
  - openvswitch/application.yaml
  - libvirt/application.yaml
  - keystone/application.yaml
  - neutron/application.yaml
  - glance/application.yaml
  - placement/application.yaml
  - cinder/application.yaml
  - nova/application.yaml
  - horizon/application.yaml
  - magnum/application.yaml
  - bootstrap/application.yaml
