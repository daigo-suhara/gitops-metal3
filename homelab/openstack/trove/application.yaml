apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: trove
  namespace: argocd
  annotations:
    # After keystone/glance/nova/neutron/cinder — Trove uses all of them.
    argocd.argoproj.io/sync-wave: "24"
spec:
  project: default
  source:
    repoURL: https://github.com/daigo-suhara/gitops-metal3.git
    targetRevision: HEAD
    path: homelab/openstack/trove
  destination:
    server: https://kubernetes.default.svc
    namespace: openstack
  syncPolicy:
    automated: {prune: true, selfHeal: true}
    syncOptions:
      - CreateNamespace=true
      - RespectIgnoreDifferences=true
