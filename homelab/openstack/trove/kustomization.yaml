apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: openstack
resources:
  # Secret with trove-guestagent.conf injected into every DB VM.
  - guestagent-config.yaml
helmCharts:
  - name: trove
    repo: https://tarballs.opendev.org/openstack/openstack-helm
    version: 2026.1.12+223862f9e
    releaseName: trove
    namespace: openstack
    includeCRDs: true
    valuesInline:
      # Pin the database public endpoint to the LAN LB IP so anything
      # outside the openstack namespace (browsers, workload cluster CLI,
      # trove guest agents in VMs) can resolve it.
      endpoints:
        database:
          host_fqdn_override:
            public:
              host: 172.16.100.109
      manifests:
        job_image_repo_sync: false
        pod_rally_test: false
      # Chart's default probes are aggressive (timeout 1s, delay 30s) and
      # trove-api takes 40+ s to complete oslo policy load on cold start
      # under load. Kubelet kill/restart loop leaves the LB with no
      # endpoints → 502 from LoadBalancer for a while. Pad the probes.
      pod:
        probes:
          api:
            trove-api:
              readiness:
                enabled: true
                params: {initialDelaySeconds: 60, periodSeconds: 15, timeoutSeconds: 10, failureThreshold: 6}
              liveness:
                enabled: true
                params: {initialDelaySeconds: 90, periodSeconds: 30, timeoutSeconds: 15, failureThreshold: 6}
      conf:
        trove:
          DEFAULT:
            # Trove guest agents inside DB VMs need a RabbitMQ endpoint
            # reachable from outside the k8s cluster. Cilium LB IPs get
            # DNATd by kube-proxy before packets exit OVS/eno2, breaking
            # the return path from qrouter netns. We deploy a dedicated
            # hostNetwork rabbitmq (bootstrap/trove-rabbitmq.yaml) pinned
            # to tx1320m3-01's eno1 IP that both taskmanager/conductor
            # AND guests connect to.
            transport_url: rabbit://trove:trovepassword@172.16.10.12:5672/trove
            default_datastore: mariadb
            # Inject the 'test' nova keypair into every Trove instance so
            # `openstack keypair` uploads (~/.ssh/openstack-test-key) let
            # us SSH the ubuntu user for guest-agent log inspection.
            # Debug convenience; safe in the homelab since guest VMs live
            # on an isolated tenant net with only ports 22/3306/4444/456x
            # reachable from the qrouter netns.
            nova_keypair: test
          taskmanager:
            # Cinder volume type used when Trove provisions a data volume
            # for the DB instance. Empty = use the default type (rbd1 in
            # our cinder config).
            cinder_volume_type: ""
patches:
  # Strip helm.sh/hook so post-install Jobs become Sync-phase (else PostSync
  # deadlock — init container waits on Jobs that ArgoCD hasn't run yet).
  - target: {kind: Job, annotationSelector: helm.sh/hook}
    patch: |-
      - op: remove
        path: /metadata/annotations/helm.sh~1hook
  # Also strip helm.sh/hook-weight — ArgoCD treats an orphaned weight as
  # a hook indicator, which pulls the Job into a very early sync-wave
  # (-5) and creates a deadlock: Job pod can't schedule because its SA
  # hasn't been applied yet, but ArgoCD won't apply the SA until the
  # Job is Healthy.
  - target: {kind: Job, annotationSelector: helm.sh/hook-weight}
    patch: |-
      - op: remove
        path: /metadata/annotations/helm.sh~1hook-weight
  # Mount trove-guestagent-etc Secret at the path trove.conf's `guest_config`
  # option points to. Only trove-taskmanager needs it (it's the one that
  # renders instance user-data), but harmless to add on api/conductor.
  - target: {kind: Deployment, name: trove-taskmanager}
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/volumeMounts/-
        value:
          name: trove-guestagent-etc
          mountPath: /etc/trove/trove-guestagent.conf
          subPath: trove-guestagent.conf
          readOnly: true
      - op: add
        path: /spec/template/spec/volumes/-
        value:
          name: trove-guestagent-etc
          secret:
            secretName: trove-guestagent-etc
            defaultMode: 0444
