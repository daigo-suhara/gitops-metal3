apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: openstack
helmCharts:
  - name: trove
    repo: https://tarballs.opendev.org/openstack/openstack-helm
    version: 2026.1.12+223862f9e
    releaseName: trove
    namespace: openstack
    includeCRDs: true
    valuesInline:
      # Pin the database public endpoint to the LAN LB IP so anything
      # outside the openstack namespace (browsers, workload cluster CLI,
      # trove guest agents in VMs) can resolve it.
      endpoints:
        database:
          host_fqdn_override:
            public:
              host: 172.16.100.109
      manifests:
        job_image_repo_sync: false
        pod_rally_test: false
      # Chart's default probes are aggressive (timeout 1s, delay 30s) and
      # trove-api takes 40+ s to complete oslo policy load on cold start
      # under load. Kubelet kill/restart loop leaves the LB with no
      # endpoints → 502 from LoadBalancer for a while. Pad the probes.
      pod:
        probes:
          api:
            trove-api:
              readiness:
                enabled: true
                params: {initialDelaySeconds: 60, periodSeconds: 15, timeoutSeconds: 10, failureThreshold: 6}
              liveness:
                enabled: true
                params: {initialDelaySeconds: 90, periodSeconds: 30, timeoutSeconds: 15, failureThreshold: 6}
      conf:
        trove:
          DEFAULT:
            # RabbitMQ URL the guest agent inside DB VMs uses to reach the
            # openstack-side conductor. Guest VMs live on tenant networks
            # and reach RabbitMQ via the floating IP the tenant router NATs
            # through br-ex/eno2. The chart's transport_url points at the
            # in-cluster rabbitmq svc.cluster.local — unreachable from
            # guests. Override to the LB IP.
            transport_url: rabbit://rabbitmq:password@172.16.100.110:5672/trove
            # Datastores are registered by a bootstrap Job (see
            # ../bootstrap/trove-datastore-mariadb.yaml).
            default_datastore: mariadb
          taskmanager:
            # Cinder volume type used when Trove provisions a data volume
            # for the DB instance. Empty = use the default type (rbd1 in
            # our cinder config).
            cinder_volume_type: ""
patches:
  # Strip helm.sh/hook so post-install Jobs become Sync-phase (else PostSync
  # deadlock — init container waits on Jobs that ArgoCD hasn't run yet).
  - target: {kind: Job, annotationSelector: helm.sh/hook}
    patch: |-
      - op: remove
        path: /metadata/annotations/helm.sh~1hook
  # Also strip helm.sh/hook-weight — ArgoCD treats an orphaned weight as
  # a hook indicator, which pulls the Job into a very early sync-wave
  # (-5) and creates a deadlock: Job pod can't schedule because its SA
  # hasn't been applied yet, but ArgoCD won't apply the SA until the
  # Job is Healthy.
  - target: {kind: Job, annotationSelector: helm.sh/hook-weight}
    patch: |-
      - op: remove
        path: /metadata/annotations/helm.sh~1hook-weight
