apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: openstack
helmCharts:
  - name: horizon
    repo: https://tarballs.opendev.org/openstack/openstack-helm
    version: 2026.1.8+a659ab8a2
    releaseName: horizon
    namespace: openstack
    includeCRDs: true
    valuesInline:
      manifests:
        job_image_repo_sync: false
      # Register dashboard plugin panels for services whose UI ships as a
      # separate pip package (magnum-ui, trove-dashboard). The packages
      # themselves get pip-installed into a shared emptyDir by the
      # install-plugins initContainer below and exposed via PYTHONPATH.
      # These enabled/*.py files come from each plugin's enabled/ dir
      # verbatim and tell Horizon to wire up the panel groups.
      conf:
        horizon:
          custom_panels:
              # ------ magnum-ui: Container Infra ------
              _1370_project_container_infra_panel_group: |
                from django.utils.translation import gettext_lazy as _
                PANEL_GROUP = 'container_infra'
                PANEL_GROUP_NAME = _('Container Infra')
                PANEL_GROUP_DASHBOARD = 'project'
                ADD_INSTALLED_APPS = ['magnum_ui']
                ADD_ANGULAR_MODULES = ['horizon.dashboard.container-infra']
                ADD_JS_FILES = ['horizon/lib/angular/angular-route.js']
                # ADD_SCSS_FILES intentionally omitted: magnum-ui 18.0.0's SCSS
                # references bootstrap variables ($gray-lighter) that don't
                # exist in newer horizon, breaking 'manage.py compress'. The
                # panels function without the custom styling.
                AUTO_DISCOVER_STATIC_FILES = True
              _1371_project_container_infra_clusters_panel: |
                PANEL = 'clusters'
                PANEL_GROUP = 'container_infra'
                PANEL_DASHBOARD = 'project'
                ADD_PANEL = 'magnum_ui.content.clusters.panel.Clusters'
              _1372_project_container_infra_cluster_templates_panel: |
                PANEL = 'cluster_templates'
                PANEL_GROUP = 'container_infra'
                PANEL_DASHBOARD = 'project'
                ADD_PANEL = 'magnum_ui.content.cluster_templates.panel.ClusterTemplates'
              _2370_admin_container_infra_panel_group: |
                from django.utils.translation import gettext_lazy as _
                PANEL_GROUP = 'container_infra'
                PANEL_GROUP_NAME = _('Container Infra')
                PANEL_GROUP_DASHBOARD = 'admin'
              _2371_admin_container_infra_quotas_panel: |
                PANEL = 'container_infra.quotas'
                PANEL_GROUP = 'container_infra'
                PANEL_DASHBOARD = 'admin'
                ADD_PANEL = 'magnum_ui.content.container_infra.quotas.panel.Quotas'
              # ------ trove-dashboard: Database ------
              _1740_project_database_panel_group: |
                from django.utils.translation import gettext_lazy as _
                PANEL_GROUP = 'database'
                PANEL_GROUP_NAME = _('Database')
                PANEL_GROUP_DASHBOARD = 'project'
                ADD_INSTALLED_APPS = ['trove_dashboard']
                AUTO_DISCOVER_STATIC_FILES = True
              _1741_project_database_databases_panel: |
                PANEL = 'databases'
                PANEL_GROUP = 'database'
                PANEL_DASHBOARD = 'project'
                ADD_PANEL = 'trove_dashboard.content.databases.panel.Databases'
              _1742_project_database_backups_panel: |
                PANEL = 'database_backups'
                PANEL_GROUP = 'database'
                PANEL_DASHBOARD = 'project'
                ADD_PANEL = 'trove_dashboard.content.database_backups.panel.Backups'
              _1743_project_database_clusters_panel: |
                PANEL = 'database_clusters'
                PANEL_GROUP = 'database'
                PANEL_DASHBOARD = 'project'
                ADD_PANEL = 'trove_dashboard.content.database_clusters.panel.Clusters'
              _1744_project_database_configurations_panel: |
                PANEL = 'database_configurations'
                PANEL_GROUP = 'database'
                PANEL_DASHBOARD = 'project'
                ADD_PANEL = 'trove_dashboard.content.database_configurations.panel.Configurations'
patches:
  # Strip helm.sh/hook so post-install Jobs become Sync-phase (else PostSync
  # deadlock — init container waits on Jobs that ArgoCD hasn't run yet).
  - target: {kind: Job, annotationSelector: helm.sh/hook}
    patch: |-
      - op: remove
        path: /metadata/annotations/helm.sh~1hook
  # Airshipit's horizon image doesn't include magnum-ui or trove-dashboard.
  # Install both into a shared emptyDir at pod start, expose via PYTHONPATH
  # so Django imports them when the panel files ADD them to INSTALLED_APPS.
  - target:
      kind: Deployment
      name: horizon
    patch: |-
      - op: add
        path: /spec/template/spec/initContainers/-
        value:
          name: install-plugins
          image: python:3.12-slim
          command: [sh, -euc]
          args:
            - |
              # --no-deps: horizon image already has django/oslo/etc.
              pip install --no-cache-dir --no-deps --target=/extra/pkgs \
                magnum-ui==18.0.0 \
                trove-dashboard==22.0.0
              # Runtime API clients the plugins import at module load time.
              # magnum-ui needs python-magnumclient + python-heatclient;
              # trove-dashboard needs python-troveclient. osc-lib is shared.
              # python-openstackclient is a transitive import path required
              # by troveclient/utils.py at module load — without it Horizon
              # crashes with `No module named 'openstackclient'` on start.
              pip install --no-cache-dir --no-deps --target=/extra/pkgs \
                python-magnumclient python-heatclient python-troveclient \
                python-openstackclient osc-lib
          volumeMounts:
            - {name: extra, mountPath: /extra}
      - op: add
        path: /spec/template/spec/containers/0/volumeMounts/-
        value: {name: extra, mountPath: /extra, readOnly: true}
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value: {name: PYTHONPATH, value: /extra/pkgs}
      - op: add
        path: /spec/template/spec/volumes/-
        value: {name: extra, emptyDir: {}}
