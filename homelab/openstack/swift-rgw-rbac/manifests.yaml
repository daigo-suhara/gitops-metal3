# Cross-namespace bits for the Swift/RGW integration.
#
# The Job that provisions the rgw keystone user + writes rgw-keystone-creds
# lives in `homelab/openstack/bootstrap/swift-setup.yaml` (openstack ns).
# These pieces need to live in rook-ceph namespace:
#   - LoadBalancer Service on 172.16.100.112 that fronts the RGW pods
#     so LAN clients and Trove guest agents can reach the Swift API.
#   - RBAC that lets the bootstrap Job's ServiceAccount write the
#     rgw-keystone-creds Secret into this namespace.
#
# They live in their own Application because the parent openstack/bootstrap
# kustomization sets `namespace: openstack` at the root, which overrides any
# per-resource namespace we'd set here.
---
apiVersion: v1
kind: Service
metadata:
  name: swift
  namespace: rook-ceph
  annotations:
    io.cilium/lb-ipam-ips: 172.16.100.112
spec:
  type: LoadBalancer
  ports:
    # RGW pod listens on 8080; the sibling rook-ceph-rgw-default svc
    # already terminates on that. We expose 80 for external clients.
    - {name: http, port: 80, targetPort: 8080}
  selector:
    app: rook-ceph-rgw
    rook_object_store: default
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: rgw-keystone-bootstrap
  namespace: rook-ceph
rules:
  - apiGroups: [""]
    resources: [secrets]
    verbs: [get, create, update, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: rgw-keystone-bootstrap
  namespace: rook-ceph
subjects:
  - kind: ServiceAccount
    name: rgw-keystone-bootstrap
    namespace: openstack
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: rgw-keystone-bootstrap
