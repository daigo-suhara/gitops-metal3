apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: openstack
helmCharts:
  - name: openvswitch
    repo: https://tarballs.opendev.org/openstack/openstack-helm
    version: 2026.1.1+a659ab8a2
    releaseName: openvswitch
    namespace: openstack
    includeCRDs: true
    valuesInline:
      manifests:
        job_image_repo_sync: false
      conf:
        # empty user_name skips `--user=openvswitch:openvswitch` on
        # ovs-vswitchd; setuid to that user needs CAP_SETUID (denied in container).
        ovs_user_name: ""
patches:
  # Strip helm.sh/hook so openstack-helm's post-install Jobs (db-init/db-sync/
  # ks-*/rabbit-init) become regular Sync-phase resources. Otherwise ArgoCD
  # defers them until the Deployment is Healthy — but the Deployment's
  # kubernetes-entrypoint init container polls exactly those Jobs. Deadlock.
  - target: {kind: Job, annotationSelector: helm.sh/hook}
    patch: |-
      - op: remove
        path: /metadata/annotations/helm.sh~1hook
