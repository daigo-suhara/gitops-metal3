# Shared by every bootstrap Job that shells out to the OpenStack CLI:
# needs read on keystone-keystone-admin to source OS_PASSWORD.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: openstack-bootstrap
  namespace: openstack
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: openstack-bootstrap
  namespace: openstack
rules:
  - apiGroups: [""]
    resources: [secrets]
    verbs: [get]
    resourceNames: [keystone-keystone-admin]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: openstack-bootstrap
  namespace: openstack
subjects: [{kind: ServiceAccount, name: openstack-bootstrap, namespace: openstack}]
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: openstack-bootstrap}
