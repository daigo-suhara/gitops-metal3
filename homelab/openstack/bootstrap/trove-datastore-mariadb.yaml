# Uploads the Trove generic guest image and registers a MariaDB datastore
# version pointing at it (by glance tags).
#
# Trove data flow when a user runs `openstack database instance create`:
#   1. trove-api creates the instance record
#   2. trove-taskmanager tells nova to boot a VM from an image matching
#      the datastore version's image tags (trove,mariadb), on the user's
#      tenant network, attached to a cinder volume
#   3. cloud-init runs trove-guestagent inside the VM; the agent connects
#      to RabbitMQ (172.16.100.110:5672) and reports back to trove-conductor
#   4. taskmanager instructs the guest to install & configure MariaDB
#
# Docs: https://docs.openstack.org/trove/latest/admin/datastore.html
---
apiVersion: batch/v1
kind: Job
metadata:
  name: glance-upload-trove-guest
  namespace: openstack
spec:
  ttlSecondsAfterFinished: 3600
  backoffLimit: 6
  template:
    spec:
      serviceAccountName: openstack-bootstrap
      restartPolicy: OnFailure
      containers:
        - name: upload
          image: quay.io/airshipit/openstack-client:2026.1-ubuntu_noble
          envFrom:
            - configMapRef: {name: openstack-bootstrap-env}
          env:
            - name: OS_PASSWORD
              valueFrom:
                secretKeyRef: {name: keystone-keystone-admin, key: OS_PASSWORD}
          resources:
            requests: {cpu: 200m, memory: 512Mi}
            limits:   {cpu: 2,    memory: 1Gi}
          volumeMounts:
            - {name: cache, mountPath: /tmp}
          command: [sh, -euc]
          args:
            - |
              IMG=trove-guest-ubuntu-jammy
              URL=https://tarballs.opendev.org/openstack/trove/images/trove-master-guest-ubuntu-jammy.qcow2
              # Duplicate-safe idempotency check (see image-uploads.yaml).
              count=$(openstack image list --name "$IMG" -f value -c ID | wc -l)
              if [ "$count" -ge 1 ]; then
                echo "$IMG already exists ($count copies)"; exit 0
              fi
              apt-get -qq update && apt-get -qq install -y curl jq
              GLANCE=http://glance-api.openstack.svc.cluster.local:9292
              TOKEN=$(openstack token issue -f value -c id)
              # Tags trove + mariadb: `openstack datastore version create
              # --image-tags trove,mariadb` matches by AND of these tags.
              IMG_ID=$(curl -sf -X POST "$GLANCE/v2/images" \
                -H "X-Auth-Token: $TOKEN" \
                -H "Content-Type: application/json" \
                -d "{
                  \"name\": \"$IMG\",
                  \"disk_format\": \"qcow2\",
                  \"container_format\": \"bare\",
                  \"visibility\": \"public\",
                  \"os_distro\": \"ubuntu\",
                  \"os_version\": \"22.04\",
                  \"hw_qemu_guest_agent\": \"yes\",
                  \"tags\": [\"trove\", \"mariadb\"]
                }" | jq -r .id)
              curl -fsSL "$URL" -o /tmp/trove.qcow2
              curl -f -X PUT -H "X-Auth-Token: $TOKEN" \
                -H "Content-Type: application/octet-stream" \
                --upload-file /tmp/trove.qcow2 \
                "$GLANCE/v2/images/$IMG_ID/file"
              openstack image show "$IMG" -c status -c size -c tags
      volumes:
        - name: cache
          emptyDir: {sizeLimit: 3Gi}
---
# `openstack datastore version create` auto-creates the parent datastore
# if it doesn't exist, so no trove-manage is required for the basic
# flow. Validation-rule loading (`trove-manage db_load_datastore_config_parameters`)
# is optional and skipped here.
apiVersion: batch/v1
kind: Job
metadata:
  name: trove-datastore-mariadb
  namespace: openstack
spec:
  ttlSecondsAfterFinished: 3600
  backoffLimit: 20
  template:
    spec:
      serviceAccountName: openstack-bootstrap
      restartPolicy: OnFailure
      containers:
        - name: register
          image: quay.io/airshipit/openstack-client:2026.1-ubuntu_noble
          envFrom:
            - configMapRef: {name: openstack-bootstrap-env}
          env:
            - name: OS_PASSWORD
              valueFrom:
                secretKeyRef: {name: keystone-keystone-admin, key: OS_PASSWORD}
          resources:
            requests: {cpu: 50m, memory: 128Mi}
            limits:   {cpu: 500m, memory: 256Mi}
          command: [sh, -euc]
          args:
            - |
              # Wait for guest image + trove API to be ready.
              until openstack image show trove-guest-ubuntu-jammy -f value -c status 2>/dev/null | grep -q active; do
                echo "waiting for guest image..."; sleep 15
              done
              until openstack datastore version list mariadb >/dev/null 2>&1 || openstack datastore list >/dev/null 2>&1; do
                echo "waiting for trove API..."; sleep 15
              done
              # Idempotent: skip if version 10.11 already registered.
              if openstack datastore version list mariadb -f value -c Name 2>/dev/null | grep -qx 10.11; then
                echo "mariadb 10.11 already registered"
              else
                openstack datastore version create 10.11 mariadb mariadb "" \
                  --image-tags trove,mariadb --active --default \
                  --version-number 10.11
              fi
              openstack datastore list
              openstack datastore version list mariadb
