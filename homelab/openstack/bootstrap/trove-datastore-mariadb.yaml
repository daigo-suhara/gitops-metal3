# Uploads the Trove generic guest image and registers the mariadb datastore.
#
# Trove data flow when a user runs `openstack database instance create`:
#   1. trove-api creates the instance record
#   2. trove-taskmanager tells nova to boot a VM from the guest image, on
#      the user's tenant network, attached to a cinder volume
#   3. cloud-init runs trove-guestagent inside the VM; the agent connects
#      to RabbitMQ (172.16.100.110:5672 via the shared secgroup) and
#      reports back to trove-conductor
#   4. taskmanager instructs the guest to install & configure the
#      datastore (mariadb) using the version registered here
---
apiVersion: batch/v1
kind: Job
metadata:
  name: glance-upload-trove-guest
  namespace: openstack
spec:
  ttlSecondsAfterFinished: 3600
  backoffLimit: 6
  template:
    spec:
      serviceAccountName: openstack-bootstrap
      restartPolicy: OnFailure
      containers:
        - name: upload
          image: quay.io/airshipit/openstack-client:2026.1-ubuntu_noble
          envFrom:
            - configMapRef: {name: openstack-bootstrap-env}
          env:
            - name: OS_PASSWORD
              valueFrom:
                secretKeyRef: {name: keystone-keystone-admin, key: OS_PASSWORD}
          resources:
            requests: {cpu: 200m, memory: 512Mi}
            limits:   {cpu: 2,    memory: 1Gi}
          volumeMounts:
            - {name: cache, mountPath: /tmp}
          command: [sh, -euc]
          args:
            - |
              IMG=trove-guest-ubuntu-jammy
              URL=https://tarballs.opendev.org/openstack/trove/images/trove-master-guest-ubuntu-jammy.qcow2
              # Duplicate-safe idempotency check (see image-uploads.yaml).
              count=$(openstack image list --name "$IMG" -f value -c ID | wc -l)
              if [ "$count" -ge 1 ]; then
                echo "$IMG already exists ($count copies)"; exit 0
              fi
              apt-get -qq update && apt-get -qq install -y curl jq
              GLANCE=http://glance-api.openstack.svc.cluster.local:9292
              TOKEN=$(openstack token issue -f value -c id)
              IMG_ID=$(curl -sf -X POST "$GLANCE/v2/images" \
                -H "X-Auth-Token: $TOKEN" \
                -H "Content-Type: application/json" \
                -d "{
                  \"name\": \"$IMG\",
                  \"disk_format\": \"qcow2\",
                  \"container_format\": \"bare\",
                  \"visibility\": \"public\",
                  \"os_distro\": \"ubuntu\",
                  \"os_version\": \"22.04\",
                  \"hw_qemu_guest_agent\": \"yes\"
                }" | jq -r .id)
              curl -fsSL "$URL" -o /tmp/trove.qcow2
              curl -f -X PUT -H "X-Auth-Token: $TOKEN" \
                -H "Content-Type: application/octet-stream" \
                --upload-file /tmp/trove.qcow2 \
                "$GLANCE/v2/images/$IMG_ID/file"
              openstack image show "$IMG" -c status -c size -c checksum
      volumes:
        - name: cache
          emptyDir: {sizeLimit: 3Gi}
---
# Registers the "mariadb" datastore and a version pointing at the guest
# image uploaded above. Runs in the trove-api pod's namespace so it has
# access to trove-manage + the trove config files the chart mounts.
#
# Idempotent — trove-manage is safe to re-run (it upserts).
apiVersion: batch/v1
kind: Job
metadata:
  name: trove-datastore-mariadb
  namespace: openstack
spec:
  ttlSecondsAfterFinished: 3600
  backoffLimit: 6
  template:
    spec:
      serviceAccountName: openstack-bootstrap
      restartPolicy: OnFailure
      containers:
        - name: register
          image: quay.io/airshipit/openstack-client:2026.1-ubuntu_noble
          envFrom:
            - configMapRef: {name: openstack-bootstrap-env}
          env:
            - name: OS_PASSWORD
              valueFrom:
                secretKeyRef: {name: keystone-keystone-admin, key: OS_PASSWORD}
          resources:
            requests: {cpu: 50m, memory: 128Mi}
            limits:   {cpu: 500m, memory: 256Mi}
          command: [sh, -euc]
          args:
            - |
              # Wait for glance image to appear (upload Job runs alongside).
              until openstack image show trove-guest-ubuntu-jammy -f value -c status 2>/dev/null | grep -q active; do
                echo "waiting for trove guest image..."
                sleep 15
              done
              IMG_ID=$(openstack image show trove-guest-ubuntu-jammy -f value -c id)
              echo "image: $IMG_ID"

              # trove-manage is exposed via the trove-api pod. Exec into it.
              # Alternative: use the "trove datastore-*" API endpoints via CLI.
              # We use CLI since we already have OS_* creds.
              if ! openstack datastore show mariadb >/dev/null 2>&1; then
                echo "datastore mariadb not registered — use trove-manage."
                echo "Run inside a trove-api pod:"
                echo "  trove-manage datastore_update mariadb ''"
                echo "  trove-manage datastore_version_update mariadb 10.11 mariadb $IMG_ID '' 1"
                echo "  trove-manage datastore_update mariadb 10.11"
                echo "Or via openstack CLI (requires admin role)."
                # Best-effort via CLI:
                openstack datastore version create 10.11 mariadb mariadb \
                  --image-glance-id "$IMG_ID" --active --default 2>&1 || echo "CLI creation may need trove-manage"
              else
                echo "datastore mariadb already registered"
              fi
              openstack datastore list
              openstack datastore version list mariadb 2>&1 || true
