# Swift/RadosGW keystone catalog registration + rgw user provisioning.
#
# The rook-ceph-namespace pieces (LB Service on 172.16.100.112 fronting the
# RGW pods, plus RBAC granting this Job's ServiceAccount write access to
# rgw-keystone-creds) live in the sibling swift-rgw-rbac Application —
# they can't share this kustomization because the root `namespace: openstack`
# transformer overrides per-resource namespaces.
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: rgw-keystone-bootstrap
  namespace: openstack
---
apiVersion: batch/v1
kind: Job
metadata:
  name: swift-setup
  namespace: openstack
spec:
  backoffLimit: 20
  ttlSecondsAfterFinished: 3600
  template:
    spec:
      serviceAccountName: rgw-keystone-bootstrap
      restartPolicy: OnFailure
      containers:
        - name: openstack
          image: quay.io/airshipit/openstack-client:2026.1-ubuntu_noble
          env:
            - {name: OS_AUTH_URL, value: "http://keystone-api.openstack.svc.cluster.local:5000/v3"}
            - {name: OS_USERNAME, value: admin}
            - name: OS_PASSWORD
              valueFrom: {secretKeyRef: {name: keystone-keystone-admin, key: OS_PASSWORD}}
            - {name: OS_PROJECT_NAME, value: admin}
            - {name: OS_USER_DOMAIN_NAME, value: Default}
            - {name: OS_PROJECT_DOMAIN_NAME, value: Default}
            - {name: OS_IDENTITY_API_VERSION, value: "3"}
            - {name: OS_INTERFACE, value: internal}
          command: [bash, -euxc]
          args:
            - |
              # Idempotent registration: skip create if it already exists.
              openstack service show swift >/dev/null 2>&1 \
                || openstack service create --name swift --description "Ceph RadosGW" object-store

              SWIFT_URL="http://172.16.100.112/swift/v1/AUTH_%(project_id)s"
              for iface in public internal admin; do
                openstack endpoint list --service swift --interface $iface --region RegionOne -f value -c URL 2>/dev/null | grep -q "$SWIFT_URL" \
                  || openstack endpoint create --region RegionOne swift $iface "$SWIFT_URL"
              done

              # RGW keystone service user. Only rewrite the password if the
              # target Secret doesn't already have one — Argo re-runs this
              # Job on every reconcile and rotating the password each time
              # invalidates RGW's cached admin token until the pod restarts.
              APISERVER=https://kubernetes.default.svc
              TOKEN=$(cat /var/run/secrets/kubernetes.io/serviceaccount/token)
              CACERT=/var/run/secrets/kubernetes.io/serviceaccount/ca.crt
              URL=$APISERVER/api/v1/namespaces/rook-ceph/secrets/rgw-keystone-creds
              EXISTING=$(curl -s --cacert $CACERT -H "Authorization: Bearer $TOKEN" $URL \
                | python3 -c "import sys,json,base64
                try:
                    d=json.load(sys.stdin)['data']['OS_PASSWORD']
                    print(base64.b64decode(d).decode())
                except Exception:
                    pass" 2>/dev/null)
              if [ -n "$EXISTING" ]; then
                RGW_PASS="$EXISTING"
              else
                RGW_PASS=$(openssl rand -base64 24 | tr -dc 'a-zA-Z0-9' | head -c 32)
              fi

              RGW_ID=$(openstack user show rgw --domain service -f value -c id 2>/dev/null || true)
              if [ -z "$RGW_ID" ]; then
                RGW_ID=$(openstack user create --domain service --password "$RGW_PASS" rgw -f value -c id)
              elif [ -z "$EXISTING" ]; then
                openstack user set --password "$RGW_PASS" "$RGW_ID"
              fi
              # admin on service project so RGW can talk to keystone AND on
              # admin@Default so validate_token works (keystone policy
              # requires the caller to hold admin somewhere the target token
              # is scoped to).
              openstack role add --user "$RGW_ID" --project service --project-domain service admin || true
              openstack role add --user "$RGW_ID" --project admin --project-domain Default admin || true

              # Write rgw-keystone-creds into rook-ceph so
              # CephObjectStore.auth.keystone can mount it. openstack-client
              # image has no kubectl, so POST/PUT via the k8s API directly.
              b64() { printf '%s' "$1" | base64 -w0; }
              BODY=$(cat <<JSON
              {"apiVersion":"v1","kind":"Secret","metadata":{"name":"rgw-keystone-creds","namespace":"rook-ceph"},"type":"Opaque","data":{
                "OS_AUTH_URL":"$(b64 http://keystone-api.openstack.svc.cluster.local:5000/v3)",
                "OS_USERNAME":"$(b64 rgw)",
                "OS_PASSWORD":"$(b64 "$RGW_PASS")",
                "OS_PROJECT_NAME":"$(b64 service)",
                "OS_USER_DOMAIN_NAME":"$(b64 service)",
                "OS_PROJECT_DOMAIN_NAME":"$(b64 service)",
                "OS_REGION_NAME":"$(b64 RegionOne)"
              }}
              JSON
              )
              SECRETS_URL=$APISERVER/api/v1/namespaces/rook-ceph/secrets
              CODE=$(curl -s -o /dev/null -w '%{http_code}' --cacert $CACERT -H "Authorization: Bearer $TOKEN" $SECRETS_URL/rgw-keystone-creds)
              if [ "$CODE" = "200" ]; then
                curl -sSf --cacert $CACERT -H "Authorization: Bearer $TOKEN" -H 'Content-Type: application/json' \
                  -X PUT -d "$BODY" $SECRETS_URL/rgw-keystone-creds >/dev/null
              else
                curl -sSf --cacert $CACERT -H "Authorization: Bearer $TOKEN" -H 'Content-Type: application/json' \
                  -X POST -d "$BODY" $SECRETS_URL >/dev/null
              fi
              echo "rgw-keystone-creds synced"
