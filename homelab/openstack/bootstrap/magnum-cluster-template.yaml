# Magnum cluster template targeting the magnum-capi-helm driver.
# Idempotent — skips if template with same name already exists.
#
# --master-lb-enabled is *NOT* passed; Octavia isn't deployed in this lab
# (magnum-capi-helm driver is patched to skip apiServer LB — see
# charts/magnum/kustomization.yaml).
#
# label 'kube_tag' picks the capi-helm-charts chart version to install; must
# match the glance image's kube_version property.
apiVersion: batch/v1
kind: Job
metadata:
  name: magnum-cluster-template-capi-v1-33
  namespace: openstack
spec:
  ttlSecondsAfterFinished: 3600
  backoffLimit: 6
  template:
    spec:
      serviceAccountName: openstack-bootstrap
      restartPolicy: OnFailure
      containers:
        - name: create
          image: quay.io/airshipit/openstack-client:2026.1-ubuntu_noble
          envFrom:
            - configMapRef: {name: openstack-bootstrap-env}
          env:
            - name: OS_PASSWORD
              valueFrom:
                secretKeyRef: {name: keystone-keystone-admin, key: OS_PASSWORD}
          resources:
            requests: {cpu: 50m, memory: 128Mi}
            limits:   {cpu: 500m, memory: 512Mi}
          command: [sh, -euc]
          args:
            - |
              TPL=capi-v1-33-jammy
              if openstack coe cluster template show "$TPL" >/dev/null 2>&1; then
                echo "template $TPL already exists"; exit 0
              fi
              openstack coe cluster template create "$TPL" \
                --coe kubernetes \
                --image ubuntu-jammy-kube-v1.33.13 \
                --external-network external \
                --master-flavor m1.medium \
                --flavor m1.medium \
                --network-driver calico \
                --docker-storage-driver overlay2 \
                --public \
                --label kube_tag=v1.33.13
              openstack coe cluster template show "$TPL"
