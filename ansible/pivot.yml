---
- name: Pivot Cluster API management to the workload cluster
  hosts: bootstrap_hosts
  become: false
  gather_facts: false
  vars_files:
    - group_vars/all.yml

  tasks:
    - name: Update the homelab repository
      become: false
      ansible.builtin.git:
        repo: "{{ repo_url }}"
        version: "{{ repo_ref }}"
        dest: "{{ repo_dir }}"
        update: true
        force: true

    - name: Wait for the workload kubeconfig
      ansible.builtin.shell:
        cmd: >-
          clusterctl get kubeconfig homelab
          --kubeconfig {{ bootstrap_kubeconfig }}
          --namespace metal3 > {{ target_kubeconfig }}
      register: target_kubeconfig_result
      retries: 60
      delay: 30
      until: target_kubeconfig_result.rc == 0
      changed_when: true

    - name: Restrict workload kubeconfig permissions
      ansible.builtin.file:
        path: "{{ target_kubeconfig }}"
        owner: "{{ ansible_user }}"
        mode: "0600"
      become: false

    - name: Pause the workload cluster before pivot
      ansible.builtin.command:
        cmd: >-
          kubectl --kubeconfig {{ bootstrap_kubeconfig }} -n metal3 patch
          cluster homelab --type=merge -p '{"spec":{"paused":true}}'
      changed_when: true

    - name: Wait for BareMetalHost pause state
      ansible.builtin.shell:
        cmd: >-
          test "$(kubectl --kubeconfig {{ bootstrap_kubeconfig }} -n metal3
          get bmh -o jsonpath='{range .items[*]}{.metadata.annotations.baremetalhost\\.metal3\\.io/paused}{"\\n"}{end}'
          | grep -c .)" -eq "$(kubectl --kubeconfig {{ bootstrap_kubeconfig }} -n metal3 get bmh --no-headers | wc -l)"
      register: bmh_pause_state
      retries: 60
      delay: 5
      until: bmh_pause_state.rc == 0
      changed_when: false

    - name: Wait for workload Argo CD
      ansible.builtin.command:
        cmd: >-
          kubectl --kubeconfig {{ target_kubeconfig }} -n argocd wait
          --for=condition=available deployment/argocd-server --timeout=600s
      changed_when: false

    - name: Stop the bootstrap Argo CD application controller
      ansible.builtin.command:
        cmd: >-
          kubectl --kubeconfig {{ bootstrap_kubeconfig }} -n argocd scale
          statefulset/argocd-application-controller --replicas=0
      changed_when: true

    - name: Stop the bootstrap Bare Metal Operator
      ansible.builtin.command:
        cmd: >-
          kubectl --kubeconfig {{ bootstrap_kubeconfig }} -n metal3 scale
          deployment/baremetal-operator-controller-manager --replicas=0
      changed_when: true

    - name: Prepare providers and Ironic on the workload cluster
      ansible.builtin.command:
        cmd: >-
          kubectl --kubeconfig {{ target_kubeconfig }} apply
          -f {{ repo_dir }}/bootstrap/pivot-prep-app-of-apps.yaml
      changed_when: true

    - name: Wait for the workload CAPI core provider
      ansible.builtin.command:
        cmd: >-
          kubectl --kubeconfig {{ target_kubeconfig }} -n capi-system rollout status
          deployment/capi-controller-manager --timeout=600s
      register: workload_capi
      retries: 60
      delay: 10
      until: workload_capi.rc == 0
      changed_when: false

    - name: Wait for the workload CAPM3 provider
      ansible.builtin.command:
        cmd: >-
          kubectl --kubeconfig {{ target_kubeconfig }} -n capi-metal3-system rollout status
          deployment/capm3-controller-manager --timeout=600s
      register: workload_capm3
      retries: 60
      delay: 10
      until: workload_capm3.rc == 0
      changed_when: false

    - name: Wait for the workload Bare Metal Operator
      ansible.builtin.command:
        cmd: >-
          kubectl --kubeconfig {{ target_kubeconfig }} -n metal3 rollout status
          deployment/baremetal-operator-controller-manager --timeout=600s
      register: workload_bmo
      retries: 60
      delay: 10
      until: workload_bmo.rc == 0
      changed_when: false

    - name: Wait for workload Ironic
      ansible.builtin.command:
        cmd: >-
          kubectl --kubeconfig {{ target_kubeconfig }} -n metal3 wait
          --for=condition=Ready ironic/ironic --timeout=600s
      register: workload_ironic
      retries: 60
      delay: 10
      until: workload_ironic.rc == 0
      changed_when: false

    - name: Move Cluster API resources to the workload cluster
      ansible.builtin.command:
        cmd: >-
          clusterctl move
          --kubeconfig {{ bootstrap_kubeconfig }}
          --to-kubeconfig {{ target_kubeconfig }}
          --namespace metal3
          -v 5
      register: clusterctl_move
      changed_when: true

    - name: Release the Ironic VIP from the bootstrap host
      ansible.builtin.command:
        cmd: >-
          kubectl --kubeconfig {{ bootstrap_kubeconfig }} -n metal3 delete
          ironic/ironic --wait=true --timeout=300s
      changed_when: true

    - name: Enable full infrastructure reconciliation on the workload cluster
      ansible.builtin.command:
        cmd: >-
          kubectl --kubeconfig {{ target_kubeconfig }} apply
          -f {{ repo_dir }}/bootstrap/workload-app-of-apps.yaml
      changed_when: true

    - name: Resume the workload cluster after pivot
      ansible.builtin.command:
        cmd: >-
          kubectl --kubeconfig {{ target_kubeconfig }} -n metal3 patch
          cluster homelab --type=merge -p '{"spec":{"paused":false}}'
      changed_when: true
