---
- name: Pivot Metal3 management to the workload cluster
  hosts: bootstrap_hosts
  become: true
  gather_facts: false
  vars_files:
    - group_vars/all.yml
  vars:
    pivot_marker: /home/{{ ansible_user }}/.homelab-pivot-complete

  tasks:
    - name: Check that the target kubeconfig exists
      ansible.builtin.stat:
        path: "{{ target_kubeconfig }}"
      register: target_kubeconfig_stat

    - name: Require a target kubeconfig
      ansible.builtin.assert:
        that: target_kubeconfig_stat.stat.exists
        fail_msg: Run the target-cluster provisioning phase first.

    - name: Check BareMetalHost states
      ansible.builtin.command:
        cmd: >-
          kubectl --kubeconfig {{ bootstrap_kubeconfig }} -n metal3 get bmh
          -o jsonpath={range .items[*]}{.metadata.name}={.status.provisioning.state}{"\n"}{end}
      register: bmh_states
      changed_when: false

    - name: Refuse to pivot while a host is provisioning
      ansible.builtin.assert:
        that:
          - "'provisioning' not in (bmh_states.stdout | lower)"
          - "'deprovisioning' not in (bmh_states.stdout | lower)"
        fail_msg: BareMetalHost operations must be idle before pivoting.

    - name: Initialize providers on the target management cluster
      ansible.builtin.command:
        argv:
          - clusterctl
          - init
          - "--kubeconfig"
          - "{{ target_kubeconfig }}"
          - "--core"
          - "cluster-api:{{ capi_version }}"
          - "--bootstrap"
          - "kubeadm:{{ capi_version }}"
          - "--control-plane"
          - "kubeadm:{{ capi_version }}"
          - "--infrastructure"
          - "metal3:{{ capm3_version }}"
          - "--ipam"
          - "metal3:{{ metal3_ipam_version }}"
      register: target_clusterctl_init
      changed_when: "'already initialized' not in (target_clusterctl_init.stdout | lower)"

    - name: Install Ironic and BMO on the target
      ansible.builtin.command:
        cmd: kubectl --kubeconfig {{ target_kubeconfig }} apply -k {{ repo_dir }}/infra/system/ironic
      changed_when: true

    - name: Stop Ironic on the bootstrap cluster
      ansible.builtin.command:
        cmd: kubectl --kubeconfig {{ bootstrap_kubeconfig }} -n metal3 scale deployment baremetal-operator-ironic --replicas=0
      changed_when: true

    - name: Move the Metal3 management resources once
      ansible.builtin.command:
        cmd: >-
          clusterctl move --kubeconfig {{ bootstrap_kubeconfig }}
          --to-kubeconfig {{ target_kubeconfig }} --namespace metal3 -v 5
      args:
        creates: "{{ pivot_marker }}"
      register: pivot_result
      changed_when: true

    - name: Mark the pivot complete
      ansible.builtin.file:
        path: "{{ pivot_marker }}"
        state: touch
        mode: "0600"
      when: pivot_result is changed

    - name: Hand management to Argo CD on the target
      ansible.builtin.command:
        cmd: kubectl --kubeconfig {{ target_kubeconfig }} apply -f {{ repo_dir }}/bootstrap/app-of-apps.yaml
      changed_when: true
