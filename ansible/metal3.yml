---
- name: Install Metal3 on the bootstrap cluster
  hosts: bootstrap_hosts
  become: true
  gather_facts: false
  vars_files:
    - group_vars/all.yml

  tasks:
    - name: Require clusterctl on the bootstrap host
      ansible.builtin.command: clusterctl version
      register: clusterctl_version_output
      changed_when: false

    - name: Initialize CAPI and Metal3 providers
      ansible.builtin.command:
        argv:
          - clusterctl
          - init
          - "--core"
          - "cluster-api:{{ capi_version }}"
          - "--bootstrap"
          - "kubeadm:{{ capi_version }}"
          - "--control-plane"
          - "kubeadm:{{ capi_version }}"
          - "--infrastructure"
          - "metal3:{{ capm3_version }}"
          - "--ipam"
          - "metal3:{{ metal3_ipam_version }}"
          - "--kubeconfig"
          - "{{ bootstrap_kubeconfig }}"
      environment:
        KUBECONFIG: "{{ bootstrap_kubeconfig }}"
      register: clusterctl_init
      changed_when: "'already initialized' not in (clusterctl_init.stdout | lower)"

    - name: Install Ironic and BMO
      ansible.builtin.command:
        cmd: kubectl --kubeconfig {{ bootstrap_kubeconfig }} apply -k {{ repo_dir }}/infra/system/ironic
      register: ironic_apply
      changed_when: true

    - name: Install BareMetalHost definitions
      ansible.builtin.command:
        cmd: kubectl --kubeconfig {{ bootstrap_kubeconfig }} apply -k {{ repo_dir }}/infra/hardware
      register: hardware_apply
      changed_when: true

    - name: Install workload cluster definitions
      ansible.builtin.command:
        cmd: kubectl --kubeconfig {{ bootstrap_kubeconfig }} apply -k {{ repo_dir }}/infra/cluster
      register: cluster_apply
      changed_when: true
